name: DFlight
options:
  bundleIdPrefix: com.dflight
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ko
  defaultSourceDirectoryType: syncedFolder
  postGenCommand: python3 scripts/set-known-regions.py
packages:
  # Firebase 13은 app-check 12, GoogleSignIn 10은 app-check 11이라 같이 못 푼다. 맞는 최신 메이저는 12다.
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn-iOS:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
configs:
  Debug: debug
  Mock: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
    Mock:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MOCK MOCK_DATA
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
targets:
  DFlight:
    type: application
    platform: iOS
    sources:
      - path: DFlight
        type: syncedFolder
        excludes:
          - "**/.gitkeep"
          - Info.plist
          - DFlight.entitlements
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseFunctions
      - package: firebase-ios-sdk
        product: FirebaseAppCheck
      - package: GoogleSignIn-iOS
        product: GoogleSignIn
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dflight
        PRODUCT_NAME: DFlight
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: DFlight/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: D-Flight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: DFlight/DFlight.entitlements
          APP_ATTEST_ENVIRONMENT: development
        Release:
          CODE_SIGN_ENTITLEMENTS: DFlight/DFlight.entitlements
          APP_ATTEST_ENVIRONMENT: production
        Mock:
          APP_ATTEST_ENVIRONMENT: development
          GOOGLE_REVERSED_CLIENT_ID: com.dflight.placeholder
  DFlightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DFlightTests
        type: syncedFolder
    dependencies:
      - target: DFlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dflight.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DFlight.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DFlight"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DFlight:
    shared: true
    build:
      targets:
        DFlight: all
        DFlightTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DFlightTests
    archive:
      config: Release
  DFlight-Mock:
    shared: true
    build:
      targets:
        DFlight: all
        DFlightTests: [test]
    run:
      config: Mock
    test:
      config: Mock
      targets:
        - DFlightTests
    profile:
      config: Mock
    analyze:
      config: Mock
    archive:
      config: Mock
